<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户采购申请</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f7fa; --card:#fff; --line:#e4e7ed; --line2:#dcdfe6;
  --txt:#303133; --txt2:#909399; --txt3:#c0c4cc; --ro:#f5f7fa;
  --brand:#f59e0b; --brand-d:#d97706; --ok:#67c23a; --danger:#f56c6c; --info:#409eff;
}
body{background:var(--bg);color:var(--txt);font:14px/1.5 "PingFang SC",PingFangSC-Regular,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:15px;font-weight:600}
main{padding:12px;width:100%;max-width:none;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.section-title{font-size:17px;font-weight:600;padding-left:9px;border-left:3px solid var(--brand);margin-bottom:16px;line-height:1.4}
.sub-title{font-size:14px;font-weight:600;margin:14px 0 8px}
.sub-title .note{font-weight:400;color:var(--txt3);font-size:12px;margin-left:8px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:5px;min-width:150px;flex:1}
/* 字段名：对标表格表头（14px / 加粗 / 深色） */
.field label{font-size:14px;font-weight:600;color:var(--txt)}
.field label .req{color:var(--danger);margin-left:2px}
/* 采购产品详情·字段行：三个字段固定统一列宽（宽屏不被拉长，窄屏可收缩换行） */
.row-identity .field{flex:0 1 260px;min-width:0}
input,select,button,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid var(--line2);border-radius:4px;padding:6px 8px;background:#fff;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(245,158,11,.2);border-color:var(--brand)}
/* 只读值：字重与表格单元格值一致（常规 400） */
input[readonly],.ro{background:#eceff4;border:1px solid #d3d9e0;color:var(--txt);font-weight:400}
button{border:1px solid var(--line2);background:#fff;border-radius:4px;padding:6px 14px;cursor:pointer;white-space:nowrap;width:auto}
button:hover{border-color:var(--brand)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button.primary:hover{background:var(--brand-d);border-color:var(--brand-d)}
button.danger{color:var(--danger);border-color:#fecaca}
button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}
th{color:var(--txt2);font-weight:500;background:#fafbfc}
td.num,th.num{text-align:right}
td input{padding:4px 6px;font-size:12.5px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:6px;max-height:460px}
/* 表单型明细表（轻流样式） */
.table-scroll{overflow:auto;max-height:460px}
.form-table{table-layout:fixed;width:auto;border-collapse:collapse;font-size:14px}
.form-table th{background:#f7f8fa;color:var(--txt);font-weight:600;padding:10px;text-align:left;white-space:nowrap;font-size:14px;border:1px solid #e4e7ed}
.form-table td{padding:9px 10px;vertical-align:middle;white-space:normal;word-break:break-word;font-size:14px;font-weight:400;color:var(--txt);border:1px solid #e4e7ed}
.form-table th:last-child,.form-table td:last-child{border:0}
.form-table .idx{width:46px;text-align:center}
.form-table .cell-ro{display:block;background:#eceff4;border:1px solid #d3d9e0;border-radius:4px;padding:6px 8px;color:var(--txt);font-weight:500;max-width:100%;white-space:normal;word-break:break-word}
/* 「采购数量」输入框：
   - 未输入（还显示着占位符）：白底 + 原边框/字重，与原来一致；
   - 已输入：灰底，外观对标同行的只读单元格（聚焦时橙色描边提示可编辑） */
.form-table input[type=number]{background:#eceff4;border:1px solid #d3d9e0;border-radius:4px;padding:6px 8px;font-weight:500;color:var(--txt)}
.form-table input[type=number]:placeholder-shown{background:#fff;border-color:var(--line2);font-weight:600}
.form-table input[type=number]::placeholder{font-weight:400;color:var(--txt2)}
.form-table .col-actions button{padding:4px 10px}
.added-tag{color:var(--txt2);font-size:14px;margin-left:8px;font-weight:400}
/* 「已在清单」行：颜色与正常行一致（不用浅灰），靠勾选状态区分 */
.modal-body tr.added{background:#fff;color:var(--txt);cursor:default}
.modal-body tr.added td{color:var(--txt)}
.muted{color:var(--txt3)}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;border:1px solid var(--line2);background:#fafafa}
.badge.warn{color:#b45309;border-color:#fde68a;background:#fffbeb}
.badge.info{color:#1d4ed8;border-color:#bfdbfe;background:#eff6ff}
.badge.ok{color:#15803d;border-color:#bbf7d0;background:#f0fdf4}
.badge.err{color:#b91c1c;border-color:#fecaca;background:#fef2f2}
.badge.muted{color:var(--txt2);border-color:var(--line2);background:#f7f8fa}
.sum{display:flex;gap:64px;flex-wrap:wrap;font-size:14px}
.sum .item span{color:var(--txt);font-size:14px;font-weight:600;display:block;margin-bottom:7px}
/* 合计值块宽度：数量 100px；金额（第 2 项起）150px */
.sum .item b{display:inline-block;background:#f5f7fa;border:0;border-radius:4px;padding:9px 13px;font-size:14px;font-weight:400;color:var(--txt);font-variant-numeric:tabular-nums;text-align:left;min-width:100px}
.sum .item:nth-child(n+2) b{min-width:150px}
.hint{font-size:12px;color:var(--txt2);margin-top:8px}
.note{font-size:12px;color:var(--txt2)}
.msg{margin-top:10px;font-size:12.5px;padding:8px 10px;border-radius:4px;display:none}
.msg.show{display:block}
.msg.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 0;margin:8px 0 20px;align-items:start}
.detail-grid .cell{font-size:14px;line-height:1.5;color:var(--txt);word-break:break-all}
.detail-grid .cell > span{color:var(--txt);font-size:14px;font-weight:600;display:block;margin-bottom:7px}
.detail-grid .cell > i.v{display:inline-block;background:#f5f7fa;border:0;border-radius:4px;padding:9px 13px;min-width:150px;font-size:14px;font-weight:400;font-style:normal;color:var(--txt);text-align:left}
.link{color:var(--info);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;width:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.spacer{flex:1}
.submit-bar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.submit-actions{margin-top:12px;text-align:left}
/* ============ 商品选择弹窗 ============ */
.pick-link{color:var(--info);cursor:pointer}
.pick-link.empty{color:var(--txt3)}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-mask[hidden]{display:none}
/* 通用提示弹框 */
.alert-box{background:#fff;border-radius:12px;width:100%;max-width:348px;padding:26px 24px 20px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.18)}
.alert-icon{width:46px;height:46px;border-radius:50%;background:#fff7e6;border:1px solid #fde68a;color:#d97706;font-size:24px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.alert-text{font-size:14px;color:var(--txt);line-height:1.7;white-space:pre-line;margin-bottom:20px;max-height:44vh;overflow:auto}
.alert-btn{width:100%;padding:9px 0;border-radius:6px;font-size:14px}
@media (max-width:640px){.alert-box{max-width:none;border-radius:10px}}
.modal{background:#fff;border-radius:8px;width:100%;max-width:1020px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.modal-head{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.modal-head .close{margin-left:auto;background:none;border:none;font-size:20px;line-height:1;cursor:pointer;color:var(--txt2);padding:0 4px}
.modal-toolbar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.modal-toolbar input{max-width:300px}
.modal-body{overflow:auto;flex:1;padding:0 16px}
/* 弹窗内表格字号：与全站表格统一（14px） */
.modal-body table{font-size:14px}
.modal-body tr.picked{background:#fff8e6}
.modal-body tr{cursor:pointer}
/* 弹窗底部：分页、每页条数与按钮一律靠左排列（不右推） */
.modal-foot{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap;justify-content:flex-start}
.modal-foot select{width:auto}
.pager{display:flex;gap:4px;align-items:center;margin-left:auto}
.modal-foot .pager{margin-left:0}
.pager button{padding:2px 8px;min-width:28px}
.pager button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pager .ellipsis{color:var(--txt3);padding:0 2px}
/* ============ 轻流风格单据表（只读展示） ============ */
.kf-wrap{overflow:auto;border-radius:8px;background:#fff}
.kf-table{table-layout:fixed;width:auto;border-collapse:collapse;font-size:14px}
.kf-table th{background:#fff;color:var(--txt);font-weight:600;text-align:left;padding:8px;white-space:nowrap;border:1px solid #e4e7ed}
.kf-table th .req{color:#f56c6c;font-weight:400;margin-left:3px}
.kf-table td{padding:8px;height:71px;vertical-align:middle;color:var(--txt);border:1px solid #e4e7ed}
.kf-table th.wrap,.kf-table td.wrap{white-space:normal}
/* 表头与值统一居中 */
.kf-table th,.kf-table td{text-align:center}
.kf-val{display:block;max-width:100%;background:transparent;border:0;border-radius:0;padding:0;line-height:1.5;font-size:14px;font-variant-numeric:tabular-nums;white-space:normal;word-break:break-word}
/* 列表型表格（如「我的单据」）：实线分隔 + 紧凑行高 */
.kf-table.list th,.kf-table.list td{border:1px solid #e4e7ed;height:44px;padding:6px 8px}
@media (max-width:640px){
  .kf-table th,.kf-table td{padding:9px 10px}
  .kf-table{min-width:560px}
  .detail-grid{gap:12px 20px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .sum{gap:28px}
  th,td{padding:6px}main{padding:8px}.card{padding:10px}.modal-mask{padding:0}.modal{max-height:100vh;border-radius:0}
}
</style>
</head>
<body>
<header>
  <h1>客户采购申请</h1>
</header>
<main>
  <div class="msg" id="globalMsg"></div>

  <!-- ========== 客户侧 ========== -->
  <section id="customerApp" hidden>
    <div class="tabs">
      <button id="tabNew" class="on" onclick="switchCustomerTab('new')">新建申请</button>
      <button id="tabMine" onclick="switchCustomerTab('mine')">我的单据</button>
    </div>

    <div id="cubeNew">
      <div class="card">
        <div class="section-title">采购产品详情</div>
        <div class="row row-identity">
          <div class="field"><label>客户</label><input id="fCustomer" readonly></div>
          <div class="field"><label>客户名称</label><input id="fCustomerName" readonly></div>
          <div class="field"><label>门店名称</label><input id="fStoreName" readonly></div>
        </div>

        <div class="sub-title">采购产品清单</div>
        <div class="toolbar">
          <button class="primary" onclick="openGoodsPicker('add')">添加商品</button>
        </div>
        <div class="table-scroll">
          <table class="form-table">
            <thead><tr>
              <th class="idx"></th>
              <th style="width:120px">商品编号</th>
              <th style="width:200px">商品名称</th>
              <th style="width:150px">规格型号</th>
              <th style="width:120px">采购数量<span style="color:#dc2626">*</span></th>
              <th style="width:90px">基本单位</th>
              <th style="width:130px">客户采购金额</th>
              <th style="width:130px">客户采购单价</th>
              <th style="width:70px"></th>
            </tr></thead>
            <tbody id="draftBody"></tbody>
          </table>
        </div>

        <div class="submit-bar">
          <div class="sum">
            <div class="item"><span>本次发货总量</span><b id="sumQty">0</b></div>
            <div class="item"><span>本次发货总额</span><b id="sumAmount">0.0000</b></div>
          </div>
        </div>
        <div class="submit-actions">
          <button class="primary" id="btnSubmit" onclick="submitOrder()">提交申请</button>
        </div>
      </div>
    </div>

    <div id="cubeMine" hidden>
      <div class="card">
        <div class="table-wrap">
          <table class="kf-table list">
            <colgroup>
              <col style="width:190px"><col style="width:100px"><col style="width:160px">
              <col style="width:60px"><col style="width:110px"><col style="width:70px">
            </colgroup>
            <thead><tr><th>单据号</th><th>状态</th><th>申请时间</th><th>总量</th><th>总额</th><th></th></tr></thead>
            <tbody id="mineBody"></tbody>
          </table>
        </div>
        <div class="toolbar" style="margin:12px 0 0;gap:12px">
          <span class="muted" id="mineCount"></span>
          <div class="pager" id="minePager" style="margin-left:0"></div>
        </div>
      </div>
      <div class="card" id="mineDetail" hidden></div>
    </div>
  </section>

  <!-- ========== 管理侧 ========== -->
  <section id="adminApp" hidden>
    <div class="tabs">
      <button id="atabTodo" class="on" onclick="switchAdminTab('todo')">审批列表</button>
      <button id="atabLink" onclick="switchAdminTab('link')">客户入口链接</button>
    </div>

    <div id="acubeTodo">
      <div class="card">
        <div class="toolbar">
          <div class="field" style="max-width:160px"><label>审批状态</label>
            <select id="filterStage" onchange="loadAdminOrders()">
              <option value="">全部</option>
              <option value="submitted">待财务审批</option>
              <option value="finance_approved">待总部审批</option>
              <option value="hq_approved">待出库</option>
              <option value="shipping">出库中</option>
              <option value="shipped">已出库</option>
              <option value="rejected">已驳回</option>
              <option value="history">历史单据</option>
            </select>
          </div>
          <div class="field" style="max-width:180px"><label>门店</label><select id="filterStore" onchange="loadAdminOrders()"><option value="">全部</option></select></div>
          <div class="field" style="max-width:180px"><label>关键字</label><input id="filterKeyword" placeholder="单据号 / 门店"></div>
          <button onclick="loadAdminOrders()">查询</button>
          <div class="spacer"></div>
          <button onclick="exportCsv()">导出 CSV</button>
        </div>
        <div class="sum" style="margin-bottom:12px">
          <div class="item"><span>待财务审批</span><b id="cntFinance">0</b></div>
          <div class="item"><span>待总部审批</span><b id="cntHq">0</b></div>
          <div class="item"><span>待出库</span><b id="cntShip">0</b></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>单据号</th><th>门店</th><th>审批状态</th><th>轻流状态</th><th>申请时间</th>
              <th>出库日期</th><th class="num">总量</th><th class="num">客户总额</th><th></th>
            </tr></thead>
            <tbody id="adminBody"></tbody>
          </table>
        </div>
      </div>
      <div class="card" id="adminDetail" hidden></div>
    </div>

    <div id="acubeLink" hidden>
      <div class="card">
        <div class="row">
          <div class="field"><label>客户门店名称</label><input id="linkStore" placeholder="例如：粮全其美国展店"></div>
          <div class="field" style="max-width:140px"><label>有效期（天）</label><input id="linkDays" type="number" value="30" min="1" max="365"></div>
          <button class="primary" onclick="createTicket('customer')">生成客户入口链接</button>
          <button onclick="createTicket('admin')">生成管理入口链接</button>
        </div>
        <div class="hint">生成的链接用于在轻流门户里内嵌；客户链接绑定门店，客户只能看到自己门店的单据。</div>
        <div id="ticketResult" style="margin-top:10px"></div>
      </div>
    </div>
  </section>

  <div class="card" id="loadingCard">正在加载…</div>

  <!-- ========== 首次身份确认弹框 ========== -->
  <div class="modal-mask" id="verifyModal" hidden>
    <div class="alert-box">
      <div class="alert-icon">!</div>
      <div class="alert-text" id="verifyText"></div>
      <input id="verifyCode" maxlength="6" inputmode="numeric" placeholder="请输入手机号后 6 位"
             style="text-align:center;letter-spacing:6px;font-size:17px;padding:9px 10px;margin-bottom:14px">
      <button class="primary alert-btn" onclick="submitVerify()">确认</button>
    </div>
  </div>

  <!-- ========== 通用提示弹框 ========== -->
  <div class="modal-mask" id="alertModal" hidden>
    <div class="alert-box">
      <div class="alert-icon">!</div>
      <div class="alert-text" id="alertText"></div>
      <button class="primary alert-btn" onclick="closeAlert()">知道了</button>
    </div>
  </div>

  <!-- ========== 选择商品弹窗 ========== -->
  <div class="modal-mask" id="goodsModal" hidden>
    <div class="modal">
      <div class="modal-head">选择商品<button class="close" onclick="closeGoodsPicker()">×</button></div>
      <div class="modal-toolbar">
        <input id="goodsKeyword" placeholder="按需输入搜索（商品编号 / 商品名称）" oninput="onGoodsSearch()">
      </div>
      <div class="modal-body">
        <table class="kf-table list">
          <colgroup>
            <col style="width:52px"><col style="width:130px"><col style="width:300px">
            <col style="width:90px"><col style="width:220px">
          </colgroup>
          <thead><tr>
            <th><input type="checkbox" id="pickAll" onchange="togglePickAll(this.checked)"></th>
            <th>物料编号</th>
            <th>商品名称</th>
            <th>基本单位</th>
            <th>规格/型号</th>
          </tr></thead>
          <tbody id="goodsBody"></tbody>
        </table>
      </div>
      <div class="modal-foot">
        <span id="pickSummary">已选 0 条 / 共 0 条</span>
        <div class="pager" id="goodsPager"></div>
        <select id="goodsPageSize" onchange="onPageSizeChange()">
          <option value="10">10 条/页</option>
          <option value="20">20 条/页</option>
          <option value="50" selected>50 条/页</option>
        </select>
        <button onclick="closeGoodsPicker()">取消</button>
        <button class="primary" onclick="confirmGoodsPicker()">确认</button>
      </div>
    </div>
  </div>
</main>

<script>
/* ======================= 基础工具 ======================= */
// 身份入口（三种，服务端签发同一个会话票据）：
//   1) 轻流门户自动注入 qfExtUserId（仅工作区成员）
//   2) 专属签名链接 ?t=<票据>（按客户预生成，内嵌到轻流门户地址里）
//   3) 客户自助：手机号 + 手机号后 6 位（外部门户用户无轻流身份时使用）
const SESSION_KEY = 'purchase_session_token';
function getToken(){
  try { const t = sessionStorage.getItem(SESSION_KEY); if (t) return t; } catch(e){}
  try { return localStorage.getItem(SESSION_KEY) || ''; } catch(e){ return ''; }
}
function setToken(t){
  try { sessionStorage.setItem(SESSION_KEY, t); } catch(e){}
  try { localStorage.setItem(SESSION_KEY, t); } catch(e){}
}
function clearToken(){
  try { sessionStorage.removeItem(SESSION_KEY); } catch(e){}
  try { localStorage.removeItem(SESSION_KEY); } catch(e){}
}

function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n, d){ const num = Number(n); return Number.isFinite(num) ? num.toFixed(d ?? 4) : '0.0000'; }
function qtyText(n){ return fmt(n, 4).replace(/\.?0+$/, '') || '0'; }
function showMsg(text, kind){
  const el = document.getElementById('globalMsg');
  el.className = 'msg show ' + (kind || 'ok');
  el.textContent = text;
  if (kind !== 'err') setTimeout(() => { el.className = 'msg'; }, 5000);
}
function showAlert(message){
  document.getElementById('alertText').textContent = message;
  document.getElementById('alertModal').hidden = false;
}
function closeAlert(){
  document.getElementById('alertModal').hidden = true;
}
async function api(path, options){
  const opts = options || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  const sessionToken = getToken();
  if (sessionToken) headers['x-portal-token'] = sessionToken;
  const res = await fetch(path, Object.assign({}, opts, { headers, cache: 'no-store' }));
  let data = null;
  try { data = await res.json(); } catch(e){ data = null; }
  if (!res.ok) throw new Error((data && (data.message || data.error)) || ('HTTP ' + res.status));
  return data;
}
function switchCustomerTab(name){
  document.getElementById('tabNew').classList.toggle('on', name === 'new');
  document.getElementById('tabMine').classList.toggle('on', name === 'mine');
  document.getElementById('cubeNew').hidden = name !== 'new';
  document.getElementById('cubeMine').hidden = name !== 'mine';
  if (name === 'mine') loadMyOrders();
}
function switchAdminTab(name){
  document.getElementById('atabTodo').classList.toggle('on', name === 'todo');
  document.getElementById('atabLink').classList.toggle('on', name === 'link');
  document.getElementById('acubeTodo').hidden = name !== 'todo';
  document.getElementById('acubeLink').hidden = name !== 'link';
}

/* ======================= 客户侧 ======================= */
let catalog = [], draft = [];

async function initCustomer(){
  document.getElementById('customerApp').hidden = false;
  const data = await api('/api/purchase/catalog');
  catalog = data.items || [];
  document.getElementById('fCustomer').value = data.customerLabel || '';
  document.getElementById('fCustomerName').value = data.customerName || '';
  document.getElementById('fStoreName').value = data.storeName || '';
  if (!data.factorConfigured){
    showMsg('未取到本门店采购系数（' + (data.storeName || '') + '），暂时无法计算客户价，请联系管理员。', 'err');
  }
  renderDraft();
}

/* ---------- 商品选择弹窗（筛选条件：状态=开启 且 配货类型=CP，由服务端下发） ---------- */
let picker = { mode: 'add', index: -1, page: 1, pageSize: 50, keyword: '', selected: new Set() };

/** 清单中已有的商品编号（excludeIndex 用于“替换某行”时排除该行自身） */
function existingCodes(excludeIndex){
  const set = new Set();
  draft.forEach((line, index) => {
    if (excludeIndex != null && index === excludeIndex) return;
    if (line.productCode) set.add(line.productCode);
  });
  return set;
}

function openGoodsPicker(mode, index){
  picker.mode = mode;
  picker.index = typeof index === 'number' ? index : -1;
  picker.page = 1;
  picker.keyword = '';
  picker.selected = new Set();
  const kwInput = document.getElementById('goodsKeyword');
  if (kwInput) kwInput.value = '';
  document.getElementById('goodsModal').hidden = false;
  renderGoodsPicker();
}

function closeGoodsPicker(){ document.getElementById('goodsModal').hidden = true; }

function onGoodsSearch(){
  picker.keyword = document.getElementById('goodsKeyword').value.trim().toLowerCase();
  picker.page = 1;
  renderGoodsPicker();
}

function onPageSizeChange(){
  picker.pageSize = Number(document.getElementById('goodsPageSize').value) || 50;
  picker.page = 1;
  renderGoodsPicker();
}

function filteredGoods(){
  const kw = picker.keyword;
  if (!kw) return catalog;
  return catalog.filter(i => i.productCode.toLowerCase().includes(kw) || i.productName.toLowerCase().includes(kw));
}

function renderGoodsPicker(){
  const list = filteredGoods();
  const pages = Math.max(1, Math.ceil(list.length / picker.pageSize));
  if (picker.page > pages) picker.page = pages;
  const start = (picker.page - 1) * picker.pageSize;
  const rows = list.slice(start, start + picker.pageSize);

  const addedSet = existingCodes(picker.mode === 'replace' ? picker.index : null);

  document.getElementById('goodsBody').innerHTML = rows.length
    ? rows.map(i => {
        const added = addedSet.has(i.productCode);
        const picked = !added && picker.selected.has(i.productCode);
        const cls = added ? 'added' : (picked ? 'picked' : '');
        const click = added ? '' : ' onclick="togglePick(\'' + esc(i.productCode) + '\')"';
        return '<tr class="' + cls + '"' + click + '>'
          + '<td onclick="event.stopPropagation()"><input type="checkbox" ' + ((picked || added) ? 'checked' : '') + (added ? ' disabled' : '') + ' onchange="togglePick(\'' + esc(i.productCode) + '\')"></td>'
          + '<td>' + esc(i.productCode) + '</td>'
          + '<td>' + esc(i.productName) + (added ? '<span class="added-tag">已在清单</span>' : '') + '</td>'
          + '<td>' + esc(i.baseUnit) + '</td>'
          + '<td>' + esc(i.spec) + '</td>'
          + '</tr>';
      }).join('')
    : '<tr><td colspan="5" class="muted" style="padding:20px;text-align:center">没有匹配的商品</td></tr>';

  const selectable = rows.filter(i => !addedSet.has(i.productCode));
  document.getElementById('pickAll').checked = selectable.length > 0 && selectable.every(i => picker.selected.has(i.productCode));
  // 「已在清单」= 之前已选过，计入已选数（与勾选状态保持一致）
  const addedInList = list.filter(i => addedSet.has(i.productCode)).length;
  document.getElementById('pickSummary').textContent = '已选 ' + (picker.selected.size + addedInList) + ' 条 / 共 ' + list.length + ' 条';

  const parts = [];
  const btn = (p, label) => '<button class="' + (p === picker.page ? 'on' : '') + '" onclick="gotoPickPage(' + p + ')">' + (label == null ? p : label) + '</button>';
  parts.push(btn(Math.max(1, picker.page - 1), '‹'));
  let lastRendered = 0;
  for (let p = 1; p <= pages; p++){
    if (pages <= 7 || p === 1 || p === pages || Math.abs(p - picker.page) <= 1){
      parts.push(btn(p));
      lastRendered = p;
    } else if (lastRendered === p - 1 && parts[parts.length - 1] !== '<span class="ellipsis">…</span>'){
      parts.push('<span class="ellipsis">…</span>');
    }
  }
  parts.push(btn(Math.min(pages, picker.page + 1), '›'));
  document.getElementById('goodsPager').innerHTML = parts.join('');
}

function gotoPickPage(page){ picker.page = page; renderGoodsPicker(); }

function togglePick(code){
  const addedSet = existingCodes(picker.mode === 'replace' ? picker.index : null);
  if (addedSet.has(code)) return;
  if (picker.selected.has(code)) picker.selected.delete(code); else picker.selected.add(code);
  renderGoodsPicker();
}

function togglePickAll(checked){
  const addedSet = existingCodes(picker.mode === 'replace' ? picker.index : null);
  const list = filteredGoods();
  const start = (picker.page - 1) * picker.pageSize;
  for (const item of list.slice(start, start + picker.pageSize)){
    if (addedSet.has(item.productCode)) continue;
    if (checked) picker.selected.add(item.productCode); else picker.selected.delete(item.productCode);
  }
  renderGoodsPicker();
}

function confirmGoodsPicker(){
  const codes = Array.from(picker.selected);
  if (codes.length === 0) return showMsg('请先勾选要采购的商品', 'err');

  if (picker.mode === 'replace' && picker.index >= 0){
    const item = catalog.find(i => i.productCode === codes[0]);
    if (item && draft[picker.index]){
      Object.assign(draft[picker.index], {
        productCode: item.productCode, productName: item.productName, spec: item.spec, baseUnit: item.baseUnit,
        qty: null, customerUnitPrice: null, customerAmount: null
      });
    }
  } else {
    const exists = existingCodes(null);
    let added = 0;
    let skipped = 0;
    for (const code of codes){
      if (exists.has(code)){ skipped += 1; continue; }
      const item = catalog.find(i => i.productCode === code);
      if (!item) continue;
      draft.push({
        productCode: item.productCode, productName: item.productName, spec: item.spec, baseUnit: item.baseUnit,
        qty: null, customerUnitPrice: null, customerAmount: null
      });
      exists.add(code);
      added += 1;
    }
    if (added === 0){
      closeGoodsPicker();
      renderDraft();
      return showMsg('所选商品已在清单中，不能重复添加', 'err');
    }
    if (skipped > 0) showMsg('已跳过 ' + skipped + ' 个清单中已有的商品', 'ok');
  }
  closeGoodsPicker();
  renderDraft();
  refreshQuote();
}

function setQty(index, value){
  const line = draft[index];
  if (!line) return;
  const raw = String(value == null ? '' : value).trim();
  const num = Number(raw);
  line.qty = raw !== '' && Number.isFinite(num) && num > 0 ? num : null;
  refreshQuote();
}

function removeLine(index){
  draft.splice(index, 1);
  renderDraft();
  refreshQuote();
}

let quoteTimer = null;
function refreshQuote(){
  clearTimeout(quoteTimer);
  quoteTimer = setTimeout(doQuote, 250);
}

async function doQuote(){
  const valid = draft.filter(l => l.productCode && l.qty > 0);
  if (valid.length === 0){
    draft.forEach(l => { l.customerUnitPrice = null; l.customerAmount = null; });
    renderDraft(); sumUp(0, 0);
    return;
  }
  try {
    const data = await api('/api/purchase/quote', {
      method: 'POST',
      body: JSON.stringify({ lines: valid.map(l => ({ productCode: l.productCode, qty: l.qty })) })
    });
    for (const line of draft){
      const hit = (data.lines || []).find(x => x.productCode === line.productCode);
      line.customerUnitPrice = hit ? hit.customerUnitPrice : null;
      line.customerAmount = hit ? hit.customerAmount : null;
    }
    renderDraft();
    sumUp(data.totalQty, data.totalAmount);
    if (data.missingFactorFor && data.missingFactorFor.length){
      showMsg('以下商品未取到采购系数，无法算价：' + data.missingFactorFor.join('、'), 'err');
    }
  } catch(e){
    showMsg('算价失败：' + e.message, 'err');
  }
}

function sumUp(qty, amount){
  document.getElementById('sumQty').textContent = qtyText(qty);
  document.getElementById('sumAmount').textContent = fmt(amount, 4);
}

function renderDraft(){
  const body = document.getElementById('draftBody');
  if (draft.length === 0){
    body.innerHTML = '<tr><td colspan="9" class="muted" style="padding:20px;text-align:center">还没有商品，点击「添加商品」选择商品</td></tr>';
    return;
  }
  body.innerHTML = draft.map((l, i) => '<tr>'
    + '<td class="idx">' + (i + 1) + '</td>'
    + '<td>' + (l.productCode ? '<span class="cell-ro">' + esc(l.productCode) + '</span>' : '<span class="muted">—</span>') + '</td>'
    + '<td><span class="cell-ro pick-link' + (l.productName ? '' : ' empty') + '" onclick="openGoodsPicker(\'replace\',' + i + ')">' + (l.productName ? esc(l.productName) : '请选择商品') + '</span></td>'
    + '<td>' + (l.spec ? '<span class="cell-ro">' + esc(l.spec) + '</span>' : '<span class="muted">—</span>') + '</td>'
    + '<td><input type="number" min="0" step="1" placeholder="请输入" value="' + (l.qty == null ? '' : esc(l.qty)) + '" oninput="setQty(' + i + ', this.value)"></td>'
    + '<td>' + (l.baseUnit ? '<span class="cell-ro">' + esc(l.baseUnit) + '</span>' : '<span class="muted">—</span>') + '</td>'
    + '<td><span class="cell-ro">' + fmt(l.customerAmount, 4) + '</span></td>'
    + '<td><span class="cell-ro">' + fmt(l.customerUnitPrice, 4) + '</span></td>'
    + '<td class="col-actions"><button class="danger" onclick="removeLine(' + i + ')">删除</button></td>'
    + '</tr>').join('');
}

async function submitOrder(){
  const lines = draft.filter(l => l.productCode && l.qty > 0).map(l => ({ productCode: l.productCode, qty: l.qty }));
  if (lines.length === 0) return showAlert('请先添加商品');
  const emptyQty = draft.filter(l => l.productCode && !(l.qty > 0));
  if (emptyQty.length > 0){
    return showAlert('以下商品还未填写采购数量：\n' + emptyQty.map(l => l.productName || l.productCode).join('\n'));
  }
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; btn.textContent = '提交中…';
  try {
    const data = await api('/api/purchase/orders', { method: 'POST', body: JSON.stringify({ lines }) });
    showMsg('提交成功，单据号：' + data.orderNo + '（本次发货总额 ' + fmt(data.totalAmount, 4) + '）', 'ok');
    draft = [];
    renderDraft(); sumUp(0, 0);
    loadMyOrders(1);
  } catch(e){
    showMsg('提交失败：' + e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = '提交申请';
  }
}

let minePage = 1, mineTotal = 0;
const MINE_PAGE_SIZE = 5;

async function loadMyOrders(page){
  if (typeof page === 'number') minePage = page;
  try {
    const data = await api('/api/purchase/orders?page=' + minePage + '&pageSize=' + MINE_PAGE_SIZE);
    mineTotal = data.total || 0;
    const body = document.getElementById('mineBody');
    body.innerHTML = (data.orders || []).length
      ? data.orders.map(o => '<tr>'
          + '<td>' + esc(o.orderNo) + '</td>'
          + '<td>' + esc(o.status) + '</td>'
          + '<td>' + esc(o.applyTime) + '</td>'
          + '<td class="num">' + qtyText(o.totalQty) + '</td>'
          + '<td class="num">' + fmt(o.totalAmount, 4) + '</td>'
          + '<td><button class="link" onclick="openMyDetail(\'' + esc(o.orderNo) + '\')">查看</button></td>'
          + '</tr>').join('')
      : '<tr><td colspan="6" class="muted" style="padding:16px;text-align:center">暂无单据</td></tr>';
    document.getElementById('mineCount').textContent = '共 ' + mineTotal + ' 条';
    renderMinePager();
  } catch(e){
    showMsg('加载单据失败：' + e.message, 'err');
  }
}

function renderMinePager(){
  const pages = Math.max(1, Math.ceil(mineTotal / MINE_PAGE_SIZE));
  if (minePage > pages) minePage = pages;
  const parts = [];
  const btn = (p, label, disabled) => '<button class="' + (p === minePage ? 'on' : '') + '" ' + (disabled ? 'disabled' : '') + ' onclick="loadMyOrders(' + p + ')">' + (label == null ? p : label) + '</button>';
  parts.push(btn(Math.max(1, minePage - 1), '‹', minePage <= 1));
  let last = 0;
  for (let p = 1; p <= pages; p++){
    if (pages <= 7 || p === 1 || p === pages || Math.abs(p - minePage) <= 1){
      parts.push(btn(p));
      last = p;
    } else if (last === p - 1 && parts[parts.length - 1] !== '<span class="ellipsis">…</span>'){
      parts.push('<span class="ellipsis">…</span>');
    }
  }
  parts.push(btn(Math.min(pages, minePage + 1), '›', minePage >= pages));
  document.getElementById('minePager').innerHTML = parts.join('');
}

async function openMyDetail(orderNo){
  const box = document.getElementById('mineDetail');
  box.hidden = false;
  box.innerHTML = '<div class="muted">加载中…</div>';
  try {
    const res = await api('/api/purchase/orders/detail?orderNo=' + encodeURIComponent(orderNo));
    box.innerHTML = renderCustomerDetail(res.order);
  } catch(e){
    box.innerHTML = '<div class="msg show err">加载失败：' + esc(e.message) + '</div>';
  }
}

/** 轻流风格的只读值块（灰底 + 虚线框） */
function kfNum(v){ return '<span class="kf-val">' + (v == null ? '—' : fmt(v, 4)) + '</span>'; }
function kfText(v){ return '<span class="kf-val">' + esc(v == null || v === '' ? '—' : v) + '</span>'; }
/** 单据头字段块：label 在上，值用虚线框 */
function kfField(label, value){
  return '<div class="cell"><span>' + esc(label) + '</span><i class="v">'
    + esc(value == null || value === '' ? '—' : value) + '</i></div>';
}

function renderCustomerDetail(order){
  const rows = order.lines.map((l, i) => '<tr>'
    + '<td class="idx">' + (i + 1) + '</td>'
    + '<td>' + kfText(l.productCode) + '</td>'
    + '<td class="wrap">' + kfText(l.productName) + '</td>'
    + '<td class="wrap">' + kfText(l.spec) + '</td>'
    + '<td class="num">' + kfText(qtyText(l.qty)) + '</td>'
    + '<td>' + kfText(l.baseUnit) + '</td>'
    + '<td class="num">' + kfNum(l.customerUnitPrice) + '</td>'
    + '<td class="num">' + kfNum(l.customerAmount) + '</td>'
    + '</tr>').join('');

  return '<div class="section-title">单据 ' + esc(order.orderNo) + '　<span class="badge info">' + esc(order.status) + '</span></div>'
    + '<div class="detail-grid" style="grid-template-columns:repeat(4,177.5px)">'
    + kfField('门店', order.storeName)
    + kfField('申请时间', order.applyTime)
    + kfField('预计收货', order.expectedArrival)
    + kfField('发货仓库', order.warehouseName)
    + '</div>'
    + '<div class="kf-wrap"><table class="kf-table">'
    + '<colgroup>'
    + '<col style="width:50px"><col style="width:100px"><col style="width:190px"><col style="width:150px">'
    + '<col style="width:50px"><col style="width:50px"><col style="width:60px"><col style="width:60px">'
    + '</colgroup>'
    + '<thead><tr>'
    + '<th class="idx">序号</th><th>商品编号</th><th class="wrap">商品名称</th><th class="wrap">规格型号</th>'
    + '<th>采购数量</th><th>基本单位</th>'
    + '<th>客户采购单价</th><th>客户采购金额</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
    + '<div class="sum" style="margin-top:16px"><div class="item"><span>本次发货总量</span><b>' + qtyText(order.totalQty) + '</b></div>'
    + '<div class="item"><span>本次发货总额</span><b>' + fmt(order.totalAmount, 4) + '</b></div></div>';
}

let adminCurrent = null;

async function initAdmin(){
  document.getElementById('adminApp').hidden = false;
  // 审批与改价继续在轻流中完成，此处仅提供全量单据的查看与导出
  document.getElementById('atabLink').hidden = true;
  document.getElementById('acubeLink').hidden = true;
  await loadAdminOrders();
}

async function loadAdminOrders(){
  const stage = document.getElementById('filterStage').value;
  const store = document.getElementById('filterStore').value;
  const kw = document.getElementById('filterKeyword').value.trim();
  const qs = new URLSearchParams();
  if (stage) qs.set('stage', stage);
  if (store) qs.set('store', store);
  if (kw) qs.set('q', kw);
  try {
    const data = await api('/api/purchase/admin/orders' + (qs.toString() ? '?' + qs.toString() : ''));
    document.getElementById('cntFinance').textContent = data.pendingFinance ?? 0;
    document.getElementById('cntHq').textContent = data.pendingHq ?? 0;
    document.getElementById('cntShip').textContent = data.pendingShip ?? 0;
    const storeSel = document.getElementById('filterStore');
    const current = storeSel.value;
    storeSel.innerHTML = '<option value="">全部</option>' + (data.stores || []).map(s => '<option value="' + esc(s) + '">' + esc(s) + '</option>').join('');
    if (current) storeSel.value = current;
    const body = document.getElementById('adminBody');
    body.innerHTML = (data.orders || []).length
      ? data.orders.map(o => '<tr>'
          + '<td>' + esc(o.orderNo) + '</td>'
          + '<td>' + esc(o.storeName) + '</td>'
          + '<td>' + stageBadge(o.approvalStage, o.approvalStageText) + '</td>'
          + '<td>' + esc(o.status) + '</td>'
          + '<td>' + esc(o.applyTime) + '</td>'
          + '<td>' + esc(o.deliveryDate || '—') + '</td>'
          + '<td class="num">' + qtyText(o.totalQty) + '</td>'
          + '<td class="num">' + fmt(o.totalCustomerAmount, 4) + '</td>'
          + '<td><button class="link" onclick="openAdminDetail(\'' + esc(o.applyId) + '\')">审批 / 查看</button></td>'
          + '</tr>').join('')
      : '<tr><td colspan="9" class="muted">暂无单据</td></tr>';
  } catch(e){
    showMsg('加载失败：' + e.message, 'err');
  }
}

function stageBadge(stage, text){
  const cls = stage === 'rejected' ? 'err'
    : stage === 'submitted' ? 'warn'
    : stage === 'finance_approved' ? 'info'
    : stage === 'history' ? 'muted'
    : 'ok';
  return '<span class="badge ' + cls + '">' + esc(text) + '</span>';
}

    box.innerHTML = '<div class="msg show err">加载失败：' + esc(e.message) + '</div>';
  }
}

        + '<td class="wrap">' + kfText(l.productName) + '</td>'
        + '<td class="wrap">' + kfText(l.spec) + '</td>'
        + '<td class="num">' + kfText(qtyText(l.qty)) + '</td>'
        + '<td>' + kfText(l.baseUnit) + '</td>'
        + '<td class="num">' + kfNum(l.purchasePrice) + '</td>'
        + '<td class="num">' + kfNum(l.priceFactor) + '</td>'
        + '<td class="num">' + kfNum(l.markupFactor) + '</td>'
        + '<td class="num">' + kfNum(l.taxRate) + '</td>'
        + '<td class="num">' + kfNum(l.priceNoTax) + '</td>'
        + '<td class="num">' + kfNum(l.amountNoTax) + '</td>'
        + '<td class="num">' + kfNum(l.customerUnitPrice) + '</td>'
        + '<td class="num">' + kfNum(l.customerAmount) + '</td>'
        + '</tr>').join('')
    + '</tbody></table></div>'
    + '<div class="sum" style="margin:12px 0"><div class="item"><span>本次发货总量</span><b>' + qtyText(order.totalQty) + '</b></div>'
    + '<div class="item"><span>客户-本次发货总额</span><b>' + fmt(order.totalCustomerAmount, 4) + '</b></div>'
    + '<div class="item"><span>内部-本次发货总额</span><b>' + fmt(order.totalInternalAmount, 4) + '</b></div></div>'
    + '<div class="hint">审批与改价请在轻流中操作；本页仅供内部查看与导出。</div>';
}

function collectPriceOverrides(){
  const result = {};
  document.querySelectorAll('[data-price-code]').forEach(input => {
    const code = input.getAttribute('data-price-code');
    const value = Number(input.value);
    const original = adminCurrent.order.lines.find(l => l.productCode === code);
    if (original && Number.isFinite(value) && value > 0 && Math.abs(value - original.customerUnitPrice) > 1e-9){
      result[code] = value;
    }
  });
  return result;
}

async function approve(action){
  if (!adminCurrent) return;
  const applyId = adminCurrent.order.applyId;
  const remark = (document.getElementById('approveRemark') || {}).value || '';
  const priceOverrides = collectPriceOverrides();
  if (!confirm('确认执行该审批操作？' + (Object.keys(priceOverrides).length ? '\n（含 ' + Object.keys(priceOverrides).length + ' 项改价）' : ''))) return;
  try {
    const data = await api('/api/purchase/admin/orders/' + encodeURIComponent(applyId) + '/approve', {
      method: 'POST',
      body: JSON.stringify({ action, remark, priceOverrides })
    });
    showMsg('操作成功：' + data.stage + (data.shippingMessage ? '（' + data.shippingMessage + '）' : ''), 'ok');
    await loadAdminOrders();
    await openAdminDetail(applyId);
  } catch(e){
    showMsg('操作失败：' + e.message, 'err');
  }
}

async function dispatchOrder(applyId){
  try {
    const data = await api('/api/purchase/admin/orders/' + encodeURIComponent(applyId) + '/dispatch', { method: 'POST' });
    showMsg(data.configured ? (data.ok ? '已发起顺丰出库' : '顺丰调用失败：' + data.message) : data.message, data.ok ? 'ok' : 'err');
    await loadAdminOrders();
    await openAdminDetail(applyId);
  } catch(e){
    showMsg('发起失败：' + e.message, 'err');
  }
}

async function exportCsv(){
  const qs = new URLSearchParams();
  const stage = document.getElementById('filterStage').value;
  const store = document.getElementById('filterStore').value;
  if (stage) qs.set('stage', stage);
  if (store) qs.set('store', store);
  const res = await fetch('/api/purchase/admin/export' + (qs.toString() ? '?' + qs.toString() : ''));
  if (!res.ok) return showMsg('导出失败', 'err');
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '客户采购申请.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function createTicket(role){
  const storeName = document.getElementById('linkStore').value.trim();
  const ttlDays = Number(document.getElementById('linkDays').value) || 30;
  if (role === 'customer' && !storeName) return showMsg('请先填写客户门店名称', 'err');
  try {
    const data = await api('/api/purchase/admin/ticket', {
      method: 'POST',
      body: JSON.stringify({ role, storeName, ttlDays })
    });
    document.getElementById('ticketResult').innerHTML =
      '<div class="hint">' + (data.storeName ? '门店：' + esc(data.storeName) + '　' : '') + '有效期：' + data.expiresInDays + ' 天</div>'
      + '<input style="width:100%;margin-top:6px" readonly value="' + esc(data.url) + '" onclick="this.select()">';
  } catch(e){
    showMsg('生成失败：' + e.message, 'err');
  }
}

/* ======================= 身份与会话 ======================= */
const ERROR_TEXT = {
  missing_identity: '请通过轻流门户入口进入本页面。',
  unauthorized: '会话已失效，请重新从轻流门户进入。',
  ticket_expired: '入口已过期，请重新从轻流门户进入。',
  workspace_mismatch: '工作区校验失败，请联系管理员。',
  user_not_found: '未找到对应的轻流账号信息，请联系管理员。',
  no_customer_profile: '未配置客户档案，请联系管理员。',
  too_many_requests: '操作过于频繁，请稍后再试。',
  too_many_attempts: '尝试次数过多，请稍后再试。',
  code_mismatch: '手机号后 6 位不正确。',
  invalid_mobile: '请输入 11 位手机号。',
  invalid_code: '请输入 6 位数字。',
  no_customer_profile: '未找到该手机号对应的客户档案，请联系管理员核对该客户登记的手机号。',
  mobile_expired: '验证已过期，请重新输入手机号。',
};
function humanize(code){ return ERROR_TEXT[code] || ('操作失败：' + code); }

/** 是否要求显示入口诊断（仅供排查：URL 加 ?debug=1 或 #debug） */
function debugEnabled(){
  try {
    if (new URLSearchParams(location.search).get('debug') === '1') return true;
  } catch(e){}
  try {
    if (String(location.hash || '').replace(/^#/, '') === 'debug') return true;
  } catch(e){}
  return false;
}

/** 入口诊断文本（默认只写控制台，不在页面上展示） */
function diagInfoText(){
  let keys = [];
  try { keys = Array.from(new URLSearchParams(location.search).keys()); } catch(e){}
  let hashKeys = [];
  try { hashKeys = Array.from(new URLSearchParams(String(location.hash || '').replace(/^#/, '')).keys()); } catch(e){}
  return [
    '地址：' + location.href,
    '来源(referrer)：' + (document.referrer || '(空)'),
    '运行位置：' + (window.self !== window.top ? 'iframe 内' : '顶层窗口'),
    'URL 参数：' + (keys.length ? keys.join(', ') : '(无)'),
    '# 参数：' + (hashKeys.length ? hashKeys.join(', ') : '(无)')
  ].join('\n');
}

/** 诊断块：仅 ?debug=1 时渲染到页面上 */
function diagBlock(){
  if (!debugEnabled()) return '';
  return '<pre style="margin-top:16px;padding:10px;border-radius:8px;background:#fafafa;border:1px solid #eee;color:#999;font-size:11px;line-height:1.7;white-space:pre-wrap;word-break:break-all">'
    + esc(diagInfoText()) + '</pre>';
}

/* ======================= 客户自助入口（手机号 + 后 6 位） ======================= */
let mobileCtx = null;

function renderMobileLogin(box){
  box.hidden = false;
  box.innerHTML = ''
    + '<div style="max-width:430px;margin:0 auto;text-align:left">'
    +   '<h3 style="margin:0 0 6px;font-size:16px">客户采购申请</h3>'
    +   '<div class="muted" style="font-size:13px;line-height:1.7;margin-bottom:14px">'
    +     '请填写在「客户端基础信息」里登记的手机号，验证通过后即可查看本店单据。'
    +   '</div>'
    +   '<input id="mlMobile" inputmode="numeric" maxlength="11" placeholder="11 位手机号" style="width:100%;box-sizing:border-box">'
    +   '<div style="margin-top:12px"><button class="primary" onclick="submitMobileLogin()">下一步</button></div>'
    +   '<div id="mlMsg" class="msg"></div>'
    +   diagBlock()
    + '</div>';
  const input = document.getElementById('mlMobile');
  if (input){
    input.focus();
    input.onkeydown = (e) => { if (e.key === 'Enter') submitMobileLogin(); };
  }
}

async function submitMobileLogin(){
  const msg = document.getElementById('mlMsg');
  const mobile = (document.getElementById('mlMobile').value || '').replace(/\D/g, '');
  msg.className = 'msg';
  if (!/^1\d{10}$/.test(mobile)){ msg.className = 'msg show err'; msg.textContent = humanize('invalid_mobile'); return; }
  msg.textContent = '正在验证手机号…';
  try {
    const res = await fetch('/api/purchase/session/mobile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mobile })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    // 手机号命中客户档案即签发会话，直接进入（后 6 位与手机号同源，不构成第二因子）
    if (data.token){
      setToken(data.token);
      mobileCtx = null;
      document.getElementById('loadingCard').hidden = true;
      await initCustomer();
      showMsg('身份确认成功', 'ok');
      return;
    }
    // 兼容：服务端若只返回挑战（旧版本行为），仍走两步验证
    if (!data.challenge) throw new Error('unknown_error');
    mobileCtx = { challenge: data.challenge };
    renderMobileCode(data);
  } catch(e){
    msg.className = 'msg show err';
    msg.textContent = humanize(e && e.message);
  }
}

function renderMobileCode(data){
  const box = document.getElementById('loadingCard');
  box.hidden = false;
  box.innerHTML = ''
    + '<div style="max-width:430px;margin:0 auto;text-align:left">'
    +   '<h3 style="margin:0 0 6px;font-size:16px">确认身份</h3>'
    +   '<div class="muted" style="font-size:13px;line-height:1.7;margin-bottom:14px">'
    +     (data.customerLabel ? '客户：' + esc(data.customerLabel) + '<br>' : '')
    +     '门店：' + esc(data.storeName || '')
    +     '<br>请填写手机号 ' + esc(data.mobileMask || '') + ' 的后 6 位'
    +     (data.factorConfigured === false ? '<br><span style="color:#c33">提示：该门店未配置采购系数，提交时无法算价。</span>' : '')
    +   '</div>'
    +   '<input id="mlCode" maxlength="6" inputmode="numeric" placeholder="后 6 位" style="width:100%;box-sizing:border-box;text-align:center;letter-spacing:6px;font-size:17px">'
    +   '<div style="margin-top:12px;display:flex;gap:8px">'
    +     '<button class="primary" onclick="submitMobileCode()">确认</button>'
    +     '<button onclick="renderMobileLogin(document.getElementById(\'loadingCard\'))">返回</button>'
    +   '</div>'
    +   '<div id="mlMsg" class="msg"></div>'
    + '</div>';
  const input = document.getElementById('mlCode');
  if (input){
    input.focus();
    input.onkeydown = (e) => { if (e.key === 'Enter') submitMobileCode(); };
  }
}

async function submitMobileCode(){
  if (!mobileCtx){ renderMobileLogin(document.getElementById('loadingCard')); return; }
  const msg = document.getElementById('mlMsg');
  const code = (document.getElementById('mlCode').value || '').replace(/\D/g, '');
  msg.className = 'msg';
  if (!/^\d{6}$/.test(code)){ msg.className = 'msg show err'; msg.textContent = humanize('invalid_code'); return; }
  msg.textContent = '正在确认…';
  try {
    const res = await fetch('/api/purchase/session/mobile/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ challenge: mobileCtx.challenge, code })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.token) throw new Error(data.error || ('HTTP ' + res.status));
    setToken(data.token);
    mobileCtx = null;
    document.getElementById('loadingCard').hidden = true;
    await initCustomer();
    showMsg('身份确认成功', 'ok');
  } catch(e){
    msg.className = 'msg show err';
    msg.textContent = humanize(e && e.message);
  }
}

/** 会话获取：已有会话直接用；否则用轻流带到 URL 上的身份换取 */
async function ensureSession(){
  if (getToken()){
    try { return await api('/api/purchase/whoami'); } catch(e){ clearToken(); }
  }

  const params = new URLSearchParams(location.search);
  const hashParams = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));

  // 兜底入口 A：专属签名链接 /purchase.html?t=<ticket>（不依赖轻流门户传参）
  const directTicket = params.get('t') || hashParams.get('t') || '';
  if (directTicket){
    setToken(directTicket);
    try { return await api('/api/purchase/whoami'); } catch(e){ clearToken(); }
  }

  // 主入口 B：轻流门户自动注入的身份
  // 注意：轻流实际注入的参数名可能是 qfWsid（小写 d），两种写法都兼容
  let extUserId = params.get('qfExtUserId') || hashParams.get('qfExtUserId') || '';
  let wsId = params.get('qfWsId') || params.get('qfWsid')
    || hashParams.get('qfWsId') || hashParams.get('qfWsid') || '';
  let ts = params.get('qfTimestamp') || hashParams.get('qfTimestamp') || '';
  if (!extUserId && document.referrer){
    try {
      const ref = new URLSearchParams(new URL(document.referrer).search);
      extUserId = ref.get('qfExtUserId') || '';
      wsId = wsId || ref.get('qfWsId') || '';
      ts = ts || ref.get('qfTimestamp') || '';
    } catch(e){ /* ignore */ }
  }
  if (!extUserId) throw new Error('missing_identity');

  const res = await fetch('/api/purchase/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ extUserId, wsId, ts })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));

  if (data.token){ setToken(data.token); return { role: data.role || 'customer', storeName: data.storeName || '' }; }
  if (data.needVerify){
    await promptVerify(extUserId, data.mobileMask, data.storeName, data.customerLabel, data.role, data.displayName);
    return { role: data.role || 'customer', storeName: data.storeName || '' };
  }
  throw new Error('unknown_error');
}

let verifyCtx = null;
function promptVerify(extUserId, mobileMask, storeName, customerLabel, role, displayName){
  return new Promise((resolve, reject) => {
    verifyCtx = { extUserId, resolve, reject };
    const isAdmin = role === 'admin';
    document.getElementById('verifyText').textContent =
      '首次进入需确认身份'
      + (isAdmin && displayName ? '\n内部账号：' + displayName : '')
      + (!isAdmin && storeName ? '\n门店：' + storeName : '')
      + (!isAdmin && customerLabel ? '\n客户：' + customerLabel : '')
      + (mobileMask ? '\n请填写手机号 ' + mobileMask + ' 的后 6 位' : '');
    const input = document.getElementById('verifyCode');
    input.value = '';
    document.getElementById('verifyModal').hidden = false;
    setTimeout(() => input.focus(), 50);
  });
}

async function submitVerify(){
  if (!verifyCtx) return;
  const code = (document.getElementById('verifyCode').value || '').trim();
  if (!/^\d{6}$/.test(code)) return showMsg('请输入 6 位数字', 'err');
  try {
    const res = await fetch('/api/purchase/session/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ extUserId: verifyCtx.extUserId, code })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.token) throw new Error(data.error || 'verify_failed');
    setToken(data.token);
    document.getElementById('verifyModal').hidden = true;
    const ctx = verifyCtx;
    verifyCtx = null;
    ctx.resolve();
    showMsg('身份确认成功', 'ok');
  } catch(e){
    showMsg(humanize(e && e.message), 'err');
  }
}

/* ======================= 启动 ======================= */
(async function boot(){
  const loading = document.getElementById('loadingCard');
  try {
    const who = await ensureSession();
    loading.hidden = true;
    if (who.role === 'admin') await initAdmin();
    else await initCustomer();
  } catch(e){
    const code = e && e.message;
    // 无轻流身份（外部门户用户）→ 走客户自助入口：手机号 + 手机号后 6 位
    if (code === 'missing_identity'){
      try { console.info('[purchase] 入口诊断\n' + diagInfoText()); } catch(e){}
      renderMobileLogin(loading);
      return;
    }
    loading.innerHTML = '<div class="msg show err">' + esc(humanize(code)) + '</div>';
  }
})();

/* ======================= 内嵌自适应：向父页面（轻流门户）上报内容高度 =======================
 * 说明：iframe 的高度由门户容器控制，页面无法自行撑开；若门户的网页组件支持"自适应高度"，
 * 通常会监听子页面的 postMessage。这里按通用约定上报，不支持的门户不会受影响。
 */
(function(){
  if (window.self === window.top) return;
  let last = 0;
  function report(){
    const h = Math.max(
      document.documentElement.scrollHeight,
      document.body ? document.body.scrollHeight : 0
    );
    if (!h || Math.abs(h - last) < 8) return;
    last = h;
    const payload = { type: 'purchase:height', source: 'purchase-html', height: h };
    try { window.parent.postMessage(payload, '*'); } catch(e){}
    try { window.top.postMessage(payload, '*'); } catch(e){}
  }
  window.addEventListener('load', report);
  window.addEventListener('resize', report);
  if (window.ResizeObserver){
    try { new ResizeObserver(report).observe(document.documentElement); } catch(e){}
  }
  setInterval(report, 1000);
})();
